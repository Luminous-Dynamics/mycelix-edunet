[workspace]
resolver = "2"
members = [
  "crates/edunet-core",
  "crates/edunet-agg",
  "zomes/learning_zome",
  "zomes/fl_zome",
  "zomes/credential_zome",
  "zomes/dao_zome",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Luminous Dynamics <info@mycelix.org>"]
license = "Apache-2.0"
repository = "https://github.com/Luminous-Dynamics/mycelix-edunet"

[workspace.dependencies]
# Holochain dependencies
hdk = "0.4"
hdi = "0.5"
holochain_integrity_types = "0.4"
holochain_zome_types = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto
blake3 = "1.5"
ed25519-dalek = "2.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }

# Statistics (for aggregation)
statrs = "0.17"

# Random generation (for tests)
rand = "0.10"
rand_chacha = "0.3"
rand_distr = "0.4"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
overflow-checks = true
